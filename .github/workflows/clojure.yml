---
name: Run tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup clj-kondo and cljfmt
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          clj-kondo: 2026.10.26
          cljfmt: 0.16.6
      - name: clj-kondo
        run: ./lint.sh
      - name: cljfmt check
        run: ./cljfmt.sh check

  test:
    strategy:
      matrix:
        env:
          - browser-npm
          - browser-npm-prod
          - bundle
          - bundle-adv
          - node-npm
          - shadow-cljs-prod
        react:
          - 19
        include:
          # Test against React 18 on a few envs
          # React 19 is not available as UMD module
          - react: 18
            env: browser-cljsjs
          - react: 18
            env: browser-cljsjs-prod
          - react: 18
            env: shadow-cljs-prod

    name: Test ${{ matrix.env }} on React ${{ matrix.react }}

    runs-on: ubuntu-latest
    env:
      REACT_VERSION: ${{ matrix.react }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          # 2.13.x tags on the GitHub mirror have a stale bin/lein (2.12.1-SNAPSHOT)
          lein: 2.12.0
          cli: latest

      # Note, react 18 doesn't get cached? Or might even mess up node cache
      - name: Setup React version
        if: ${{ matrix.react == 18 }}
        run: |
          cp react-18-package.json package.json
          cp react-18-package-lock.json package-lock.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      # setup-java cache only looks at pom.xml for the key
      - name: Cache m2
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/project.clj', 'shadow-cljs.edn', 'deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Install node deps
        run: npm ci

      - name: Run tests
        run: ./test-environments/${{ matrix.env }}/test.sh

  e2e:
    name: Controlled input e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      # setup-java cache only looks at pom.xml for the key
      - name: Cache m2
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/project.clj', 'shadow-cljs.edn', 'deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Install node deps
        run: npm ci

      # Playwright recommends not caching browsers: restoring takes about as
      # long as downloading, and the system deps have to be installed anyway.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Run e2e tests
        run: npm run test:e2e

      # Traces of failed tests (playwright.config.js: trace retain-on-failure),
      # open with `npx playwright show-trace <trace.zip>` or trace.playwright.dev
      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

  update-site:
    name: Update site
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: test
    environment: build-site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          # 2.13.x tags on the GitHub mirror have a stale bin/lein (2.12.1-SNAPSHOT)
          lein: 2.12.0
          cli: latest
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      # setup-java cache only looks at pom.xml for the key
      - name: Cache m2
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/project.clj', 'shadow-cljs.edn', 'deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Install node deps
        run: npm ci

      - name: Build site
        run: ./build-example-site.sh
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}

  update-tagged-docs:
    name: Update docs
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref,  'refs/tags/') }}
    needs: test
    environment: build-site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          # 2.13.x tags on the GitHub mirror have a stale bin/lein (2.12.1-SNAPSHOT)
          lein: 2.12.0
          cli: latest

      # setup-java cache only looks at pom.xml for the key
      - name: Cache m2
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/project.clj', 'shadow-cljs.edn', 'deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build docs
        run: ./build-docs.sh
        # Fine grained personal access token, 366 days expiry, only contents rw permission to the site repo
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
